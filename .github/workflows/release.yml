name: Release

# Publishing happens ONLY on a version tag push. Running the workflow by hand
# (Actions -> Release -> Run workflow) is a dry run: it builds all three images
# and generates their SBOMs but never logs in to the registry, pushes, signs, or
# touches a GitHub release, so the pipeline can be checked without releasing.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    # Only this job gets more than read access.
    permissions:
      contents: write # attach the SBOMs to the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    strategy:
      fail-fast: false
      # Every leg attaches an SBOM to the same GitHub release; run them one at a
      # time so they cannot race creating it.
      max-parallel: 1
      matrix:
        include:
          # Manager image keeps the bare repository name; the others get a suffix.
          - component: manager
            dockerfile: Dockerfile
            image_suffix: ""
          - component: proxy
            dockerfile: Dockerfile.proxy
            image_suffix: "-proxy"
          - component: podtls
            dockerfile: Dockerfile.podtls
            image_suffix: "-podtls"
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
      PUBLISH: ${{ github.event_name == 'push' }}
      VERSION: ${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dry run loads the image into the local Docker daemon instead of
      # pushing, so the build and the SBOM step are still exercised.
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          # The source label links the package to this repository (so it shows
          # on the repo page and can inherit its permissions); revision ties an
          # image to the exact commit it was built from.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      # Verify exactly what the README tells users to run. The signing step only
      # proves cosign ran; this proves the signature is there and carries the
      # identity consumers are told to expect.
      - name: Verify the signature we just made
        if: env.PUBLISH == 'true'
        run: |
          cosign verify "${IMAGE}:${VERSION}" \
            --certificate-identity-regexp 'https://github.com/amphoralabs/amphora/\.github/workflows/release\.yml@refs/tags/v.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          # We attach the SBOM ourselves below under a stable per-component
          # name; the action would otherwise upload a second copy.
          upload-release-assets: false
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cyclonedx.json

      - name: Attach SBOM to release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ matrix.component }}.cyclonedx.json
          generate_release_notes: true
          # A semver pre-release tag (v0.1.0-alpha.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # After publishing, install the images we just published, exactly as a user would
  # (pulled from ghcr.io, not built here), and check they work: cert-manager issues
  # the certificates, the webhook enforces the rules, and a model is served through
  # the TLS sidecar. A failure here does not unpublish anything, but it tells us
  # immediately that a release is broken instead of the first user finding out.
  smoke:
    needs: build-sign-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Deploy test against the published images
        env:
          DEPLOY_RELEASE_TAG: ${{ github.ref_name }}
        run: make test-deploy

