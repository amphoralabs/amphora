name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write # required for keyless cosign signing via OIDC

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both legs attach an SBOM to the same GitHub release; run them one at a
      # time so they cannot race creating it.
      max-parallel: 1
      matrix:
        include:
          # Manager image keeps the bare repository name; the proxy gets a suffix.
          - component: manager
            dockerfile: Dockerfile
            image_suffix: ""
          - component: proxy
            dockerfile: Dockerfile.proxy
            image_suffix: "-proxy"
    env:
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Go module
        id: gomod
        run: echo "present=$(test -f go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Log in to GitHub Container Registry
        if: steps.gomod.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.gomod.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Install cosign
        if: steps.gomod.outputs.present == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        if: steps.gomod.outputs.present == 'true'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        if: steps.gomod.outputs.present == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cyclonedx.json

      - name: Attach SBOM to release
        if: steps.gomod.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ matrix.component }}.cyclonedx.json
