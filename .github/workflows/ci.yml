name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These steps activate once the Go module (go.mod) lands with the operator scaffold.
      - name: Check for Go module
        id: gomod
        run: echo "present=$(test -f go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        if: steps.gomod.outputs.present == 'true'
        run: go vet ./...

      - name: golangci-lint
        if: steps.gomod.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint-action v6 doesn't support golangci-lint v2 at all; v7 is required.
          # Our .golangci.yml is v2-schema and go.mod targets a Go version newer than the
          # v1.x binaries are built with, so pin an explicit v2 release.
          version: v2.13.2

      - name: go test
        if: steps.gomod.outputs.present == 'true'
        # Uses the `test` Makefile target (not `go test ./...` directly) so envtest's
        # KUBEBUILDER_ASSETS are provisioned and test/e2e (which needs a real cluster) is
        # excluded, matching local dev workflow.
        run: make test

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Go module
        id: gomod
        run: echo "present=$(test -f go.mod && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        if: steps.gomod.outputs.present == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
