# Minimal e2e deployment of the manager and proxy. Deliberately does not use
# config/default: that pulls in kube-rbac-proxy and cert-manager, which the
# behavior under test does not need. ClusterRoles come from config/rbac.
apiVersion: v1
kind: Namespace
metadata:
  name: amphora-system
---
# kind has no NVIDIA runtime; map the RuntimeClass the controller requests onto
# the default runc handler so pods can start without a GPU.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: runc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: amphora-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: amphora-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: amphora-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: manager}
  template:
    metadata:
      labels: {app: manager}
    spec:
      serviceAccountName: manager
      containers:
      - name: manager
        image: amphora-manager:e2e
        imagePullPolicy: IfNotPresent
        args: ["--leader-elect=false"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxy
  namespace: amphora-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proxy-role
subjects:
- kind: ServiceAccount
  name: proxy
  namespace: amphora-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: amphora-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: proxy}
  template:
    metadata:
      labels: {app: proxy}
    spec:
      serviceAccountName: proxy
      containers:
      - name: proxy
        image: amphora-proxy:e2e
        imagePullPolicy: IfNotPresent
        args: ["-sync-from-cluster", "-deferral-timeout=120s"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: amphora-system
spec:
  selector: {app: proxy}
  ports:
  - port: 8080
    targetPort: 8080
