---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modeldeployments.amphora.amphora.sh
spec:
  group: amphora.amphora.sh
  names:
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    singular: modeldeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenancyClass
      name: Tenancy
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.effectivePackingMode
      name: Packing
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelDeployment is the Schema for the modeldeployments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelDeploymentSpec defines the desired state of ModelDeployment
            properties:
              allowedRegions:
                description: |-
                  AllowedRegions constrains scheduling/failover to these regions/clusters (data
                  residency enforcement, Technical Specification §4.3). Required for RegulatedMultiTenant.
                items:
                  type: string
                type: array
              evalGate:
                description: EvalGate configures the pre-traffic-flip canary probe
                  (§3.2.1).
                properties:
                  canaryConfigMapRef:
                    description: CanaryConfigMapRef names a ConfigMap holding the
                      canary prompt set and matcher config.
                    type: string
                  enabled:
                    default: false
                    description: |-
                      Enabled turns on the eval gate. If false, only the default latency-only probe runs
                      and the audit trail records the deployment as "quality unverified".
                    type: boolean
                  probePort:
                    default: 8000
                    description: |-
                      ProbePort is the port on the serving pod the gate's health probe
                      targets. Defaults to 8000 (vLLM's default server port).
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  timeoutMillis:
                    default: 150
                    description: |-
                      TimeoutMillis is the gate deadline; on timeout the controller fails closed
                      (traffic is not flipped, the swap is rolled back).
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              gpuFraction:
                description: |-
                  GPUFraction is the MIG profile (e.g. "1g.10gb") or fractional share requested.
                  Required when TenancyClass is RegulatedMultiTenant (enforced by the admission webhook).
                type: string
              image:
                description: Image is the container image serving the model (e.g.
                  a vLLM-based image).
                type: string
              maxColocatedModels:
                description: |-
                  MaxColocatedModels caps how many models the Packing Scheduler may place on the
                  same physical GPU alongside this one.
                format: int32
                minimum: 1
                type: integer
              priorityClass:
                description: PriorityClass governs preemption order among co-located
                  models on a shared GPU.
                type: string
              tenancyClass:
                description: |-
                  TenancyClass is immutable post-creation: downgrading isolation guarantees on a
                  running workload requires deleting and recreating the ModelDeployment.
                enum:
                - SingleTenant
                - TrustedMultiTenant
                - RegulatedMultiTenant
                type: string
                x-kubernetes-validations:
                - message: tenancyClass is immutable; delete and recreate to change
                    isolation guarantees
                  rule: self == oldSelf
            required:
            - image
            - tenancyClass
            type: object
          status:
            description: ModelDeploymentStatus defines the observed state of ModelDeployment
            properties:
              activePod:
                description: |-
                  ActivePod names the pod currently serving (or warming up for) this
                  ModelDeployment, after being hijacked from a matching PausePool
                  (Technical Specification §10). Empty until a hijack has occurred.
                type: string
              conditions:
                description: |-
                  Conditions surfaces gate outcomes, e.g. QualityVerified=False with
                  reason LatencyOnly while only the default latency probe runs.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effectivePackingMode:
                description: |-
                  EffectivePackingMode records what the Packing Scheduler actually assigned (MIG/TimeSlice/None),
                  so drift from the requested TenancyClass guarantee is observable.
                type: string
              endpoint:
                description: |-
                  Endpoint is the base URL (e.g. "http://10.0.0.5:8000") of the pod
                  serving this deployment. Set only while Phase is Serving; the Proxy
                  watches it to learn which models are warm.
                type: string
              evalFailures:
                description: |-
                  EvalFailures counts consecutive eval-gate failures for this
                  deployment. At the controller's threshold, auto-promotion pauses until
                  an operator approves (circuit breaker, §3.2.1).
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation reconciled
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse human-readable state (e.g. Pending,
                  Warm, Serving, RolledBack).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
