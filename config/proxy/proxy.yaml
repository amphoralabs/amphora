# The inference proxy (spec §3.1/§10). It routes requests only to models the
# controller reports Serving by watching ModelDeployment status, so it needs
# nothing but the read-only role in config/rbac/proxy_role.yaml.
#
# This runs plain HTTP, which logs a warning that the tenant header is
# client-asserted. For client identity and TLS add -tls-cert/-tls-key/
# -tls-client-ca (see the README), and for encrypted transport to model pods
# include the config/podtls component.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: system
  labels:
    app.kubernetes.io/name: amphora
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amphora
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amphora
        app.kubernetes.io/component: proxy
    spec:
      serviceAccountName: proxy
      securityContext:
        runAsNonRoot: true
      containers:
      - name: proxy
        image: proxy:latest
        args:
        - -sync-from-cluster
        ports:
        - name: http
          containerPort: 8080
        # /healthz is served on the same listener as inference traffic and is
        # reachable without a client certificate when -tls-client-ca is set.
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: system
  labels:
    app.kubernetes.io/name: amphora
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: amphora
    app.kubernetes.io/component: proxy
  ports:
  - name: http
    port: 8080
    targetPort: http
