# Serve metrics from the manager itself over https with authn/authz
# (controller-runtime's filter), replacing the deprecated kube-rbac-proxy
# sidecar. The Service in config/rbac/auth_proxy_service.yaml targets the
# named port below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - "--health-probe-bind-address=:8081"
        - "--metrics-bind-address=:8443"
        - "--metrics-secure"
        - "--leader-elect"
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
